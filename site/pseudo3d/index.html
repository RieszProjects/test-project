<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>伪 3D 重建</title>
    <meta name="description" content="由多张不同角度的生成图片重建的伪 3D 模型，可实时旋转查看。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='%2312151b' stroke='%23cfa75e' stroke-width='2'/%3E%3Cpath d='M4 10l12 7 12-7M16 17v12' fill='none' stroke='%23cfa75e' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="css/viewer.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="view" aria-label="三维视图"></canvas>

      <header class="brand">
        <a class="back" href="../">工具与实验</a>
        <h1>伪 3D 重建</h1>
        <nav class="objects" id="objects" aria-label="模型"></nav>
        <p class="meta"><span id="obj-title">—</span><span class="dot">·</span><span id="obj-count">0</span> 张照片</p>
      </header>

      <button class="panel-toggle" id="panel-toggle" aria-controls="panel" aria-expanded="true" title="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6" /></svg>
      </button>

      <aside class="panel" id="panel">
        <section>
          <h2>渲染</h2>
          <div class="segmented" id="mode" role="radiogroup" aria-label="渲染模式">
            <button role="radio" data-mode="blend" aria-checked="true">混合</button>
            <button role="radio" data-mode="nearest" aria-checked="false">单张</button>
            <button role="radio" data-mode="geometry" aria-checked="false">几何</button>
            <button role="radio" data-mode="weights" aria-checked="false">来源</button>
          </div>
          <label class="slider">
            <span class="slider-head"><span>混合张数</span><output id="blend-out">2</output></span>
            <input type="range" id="blend" min="1" max="6" step="1" value="2" />
          </label>
        </section>
        <section>
          <h2>显示</h2>
          <label class="switch"><input type="checkbox" id="opt-spin" checked /><i></i><span>自动旋转</span></label>
          <label class="switch"><input type="checkbox" id="opt-cards" /><i></i><span>源相机</span></label>
          <label class="switch"><input type="checkbox" id="opt-shadow" checked /><i></i><span>地面阴影</span></label>
          <label class="switch"><input type="checkbox" id="opt-ortho" /><i></i><span>正交投影</span></label>
        </section>
        <section class="stats" id="stats"></section>
      </aside>

      <nav class="strip" id="strip" aria-label="源照片"></nav>

      <p class="hint">拖动旋转 · 右键平移 · 滚轮缩放 · 双击复位</p>

      <div class="loading" id="loading" role="status">
        <div class="loading-bar"><i id="loading-fill"></i></div>
        <span id="loading-text">加载中</span>
      </div>
      <div class="toast" id="toast" role="alert" hidden></div>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
